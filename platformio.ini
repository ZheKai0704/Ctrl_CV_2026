; PlatformIO Project Configuration File
; 棒球機器人 RP2350 多環境編譯設定 (終極白名單排除語法)

; ---- 全域共享設定 ----
[env]
monitor_speed = 115200
build_flags = -I include -I lib 

; --- 環境 1: Pico Hub ---
[env:pico_hub]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
; board = waveshare_rp2350_plus
board = waveshare_rp2350_plus
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<hub/>

; --- 環境 2: Pico move ---
[env:pico_move]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_plus
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<move/>

; --- 環境 3: Pico storage ---
[env:pico_storage]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_plus
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<storage/>

; --- 環境 4: Pico shoot ---
[env:pico_shoot]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_plus
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<shoot/>

; --- 環境 5: 超音波整合 ---
[env:ultrasonic]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_plus
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<ultrasonic/>


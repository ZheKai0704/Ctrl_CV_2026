[env:emm42_test]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_plus
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
build_src_filter = +<test/emm42_test>

